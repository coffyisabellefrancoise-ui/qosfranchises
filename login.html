<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Traducteur Audio/Vidéo</title>
    <style>
        :root {
            --orange: #ff7900;
            --black: #000000;
            --grey: #f4f4f4;
            --dark-grey: #333;
            --red: #c62828;
            --green: #2e7d32;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--grey);
            margin: 0;
            color: var(--dark-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin-top: 0;
            border-bottom: 4px solid var(--orange);
            padding-bottom: 10px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin: 14px 0 6px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            background-color: var(--orange);
            border: none;
            color: white;
            padding: 12px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
        }
        button:hover:not(:disabled) { background-color: #e06d00; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .toggle {
            text-align: center;
            margin-top: 14px;
            font-size: 0.85rem;
        }
        .toggle a { color: var(--orange); cursor: pointer; text-decoration: underline; }
        .msg {
            margin-top: 14px;
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .msg.error { background: #fdecea; color: var(--red); display: block; }
        .msg.ok { background: #e8f5e9; color: var(--green); display: block; }
        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 id="formTitle">Connexion</h1>
    <form id="authForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
        <button type="submit" id="submitBtn">Se connecter</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="toggle">
        <span id="toggleText">Pas encore de compte ?</span>
        <a id="toggleLink">Créer un compte</a>
    </p>
    <a class="back" href="index.html">&larr; Retour au Dashboard</a>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('authForm');
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const submitBtn = document.getElementById('submitBtn');
const msgEl = document.getElementById('msg');
const formTitle = document.getElementById('formTitle');
const toggleText = document.getElementById('toggleText');
const toggleLink = document.getElementById('toggleLink');

let mode = 'login';

function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = `msg ${type}`;
}

toggleLink.addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    if (mode === 'signup') {
        formTitle.textContent = 'Créer un compte';
        submitBtn.textContent = "S'inscrire";
        toggleText.textContent = 'Déjà un compte ?';
        toggleLink.textContent = 'Se connecter';
    } else {
        formTitle.textContent = 'Connexion';
        submitBtn.textContent = 'Se connecter';
        toggleText.textContent = 'Pas encore de compte ?';
        toggleLink.textContent = 'Créer un compte';
    }
    msgEl.className = 'msg';
});

// Redirige immédiatement si déjà connecté
supabase.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'traduction-audio.html';
});

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    msgEl.className = 'msg';

    const email = emailEl.value.trim();
    const password = passwordEl.value;

    try {
        if (mode === 'signup') {
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            showMsg('Compte créé ! Vérifiez votre email si une confirmation est requise, puis connectez-vous.', 'ok');
            mode = 'login';
            toggleLink.click();
            toggleLink.click(); // remet le libellé "Connexion"
        } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            window.location.href = 'traduction-audio.html';
        }
    } catch (err) {
        showMsg(err.message || 'Une erreur est survenue.', 'error');
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
